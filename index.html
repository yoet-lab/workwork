<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋力トレーニング記録・管理Web</title>
    <style>
        body{
            /*真っ白、真っ黒だと目が疲れやすいため、少し暗い白色と、少し明るい黒色にした*/
            background:#f0f2f5;
            color:#333333;
        }
        .container{
            max-width:800px;
            margin:0 auto;
            background:white;
            padding:20px;
        }
        .section{
            margin-bottom:30px;
            padding:15px;
            border:1px solid gray;
        }
        button{
            background:blue;
            color:white;
            padding:10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>　筋力トレーニング記録・管理Web　</h1>

    <div class="section">
        <h2>1. 種目の記録</h2>
        <input type="text" id="workout-name" placeholder="種目名（例：ベンチプレス）">
        <input type="text" id="workout-tags" placeholder="部位タグ（例：#胸筋）">
        <button onclick="addWorkout()">種目を登録</button>

        <h3>種目一覧（タグ検索）</h3>
        <select id="search-tag" onchange="searchWorkouts()">
            <option value="">すべて表示</option>
        </select>
        <ul id="workout-list"></ul>
    </div>

    <div class="section">
        <h2>2. トレーニングメニューの記録</h2>
        <label>日付を選択：</label>
        <input type="date" id="record-date"><br>

        <label>種目を選択：</label>
        <select id="record-workout-select">
            <option value="">種目を選択してください</option>
        </select><br>
        
        <input type="number" id="record-weight" placeholder="重量 (kg)" min="0">
        <input type="number" id="record-rep" placeholder="レップ数" min="0">
        <input type="number" id="record-set" placeholder="セット数" min="0">
        <button onclick="saveLog()">記録を保存</button>
    </div>

    <div class="section">
        <h2>3. 日付ごとの履歴確認</h2>
        <input type="date" id="view-date" onchange="viewLogByDate()">
        <div id="log-results">
            <p>日付を選択すると、その日のメニューが表示されます。</p>
        </div>
    </div>
</div>

<script>
    let workouts = JSON.parse(localStorage.getItem('workouts')) || [];
    let logs = JSON.parse(localStorage.getItem('logs')) || [];
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('record-date').value = today;
        document.getElementById('view-date').value = today;
        
        updateWorkoutList();
        updateSelectOptions();
        viewLogByDate();
    };
    function addWorkout() {
        const nameInput = document.getElementById('workout-name');
        const tagsInput = document.getElementById('workout-tags');
        
        const name = nameInput.value.trim();
        const tagsRaw = tagsInput.value.trim();
        
        if (!name) {
            alert('種目名が未入力です');
            return;
        }
        const tags = tagsRaw ? tagsRaw.split(/\s+/).filter(t => t.startsWith('#')) : [];
        const newWorkout = { id: Date.now(), name: name, tags: tags };
        workouts.push(newWorkout);
        localStorage.setItem('workouts', JSON.stringify(workouts));
        
        alert('種目を登録しました');
        
        nameInput.value = '';
        tagsInput.value = '';
        
        updateWorkoutList();
        updateSelectOptions();
    }

    function updateWorkoutList(filterTag = '') {
        const list = document.getElementById('workout-list');
        list.innerHTML = '';

        let count = 0;

        workouts.forEach(w => {
            if(filterTag && !w.tags.includes(filterTag)) return;
            if(!filterTag && count >= 3){
                if(count == 3){
                    list.insertAdjacentHTML('beforeend', '<li><em>...etc.</em></li>');
                }
                count++;
                return;
            }

            const itemLogs = logs.filter(l => l.workoutId == w.id).sort((a, b) => new Date(b.date) - new Date(a.date));
            let lastRecordText = '記録なし';
            
            if (itemLogs.length > 0) {
                const last = itemLogs[0];
                lastRecordText = `${last.date}：${last.weight}kg / ${last.rep}rep / ${last.set}set`;
            }

            const tagSpans = w.tags.map(t => `<span class="tag" style="cursor:pointer;" onclick="setSearchTag('${t}')">${t}</span>`).join('');

            const li = document.createElement('li');
            li.style.marginBottom = '8px';
            li.innerHTML = `<strong>${w.name}</strong> ${tagSpans} <br><small style="color:#666;">(前回: ${lastRecordText})</small>`;
            list.appendChild(li);

            count++;
        });
    }

    function searchWorkouts() {
        const query = document.getElementById('search-tag').value.trim();
        updateWorkoutList(query);
    }

    function setSearchTag(tag) {
        document.getElementById('search-tag').value = tag;
        updateWorkoutList(tag);
    }

    function updateSelectOptions() {
        const select = document.getElementById('record-workout-select');
        select.innerHTML = '<option value="">種目を選択してください</option>';
        
        workouts.forEach(w => {
            const option = document.createElement('option');
            option.value = w.id;
            option.textContent = w.name;
            select.appendChild(option);
        });
    }

    function saveLog() {
        const date = document.getElementById('record-date').value;
        const workoutId = document.getElementById('record-workout-select').value;
        const weight = document.getElementById('record-weight').value;
        const rep = document.getElementById('record-rep').value;
        const set = document.getElementById('record-set').value;

        if (!date || !workoutId || !weight || !rep || !set) {
            alert('すべての項目を正しく入力してください！');
            return;
        }

        const newLog = {
            id: Date.now(),
            date: date,
            workoutId: workoutId,
            weight: weight,
            rep: rep,
            set: set
        };

        logs.push(newLog);
        localStorage.setItem('logs', JSON.stringify(logs));

        /*なくてもいいが、あったら記録したことが確実に分かる*/
        alert('記録しました');
        
        document.getElementById('record-weight').value = '';
        document.getElementById('record-rep').value = '';
        document.getElementById('record-set').value = '';
        updateWorkoutList();
        viewLogByDate();
    }
    function viewLogByDate() {
        const targetDate = document.getElementById('view-date').value;
        const resultsDiv = document.getElementById('log-results');
        resultsDiv.innerHTML = '';

        if (!targetDate) return;
        const dayLogs = logs.filter(l => l.date === targetDate);

        if (dayLogs.length === 0) {
            resultsDiv.innerHTML = '<p style="color:#888;">記録なし</p>';
            return;
        }

        const ul = document.createElement('ul');
        dayLogs.forEach(l => {
            const workout = workouts.find(w => w.id == l.workoutId);
            const workoutName = workout ? workout.name : '削除された種目';

            const li = document.createElement('li');
            li.innerHTML = ` <strong>${workoutName}</strong> : ${l.weight} kg × ${l.rep} rep / ${l.set} set`;
            ul.appendChild(li);
        });
        resultsDiv.appendChild(ul);
    }
</script>

</body>
</html>
